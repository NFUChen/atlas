name: CD - Release Binaries

on:
  push:
    tags:
      - "v*"
    branches:
      - master

permissions:
  contents: write

env:
  ATLAS_NO_UPGRADE_SUGGESTIONS: 1

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux builds on ubuntu (CGO for sqlite3)
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          # macOS builds on Apple Silicon runner (clang cross-compiles amd64 natively)
          - runner: macos-14
            goos: darwin
            goarch: amd64
            cc: ""
          - runner: macos-14
            goos: darwin
            goarch: arm64
            cc: ""
          # Windows — CGO disabled (no sqlite3 support)
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/atlas/go.mod

      - name: Install cross-compiler (linux/arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build binary
        working-directory: cmd/atlas
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          BINARY_NAME="atlas-${GOOS}-${GOARCH}${EXT}"
          go build \
            -ldflags "-s -w -X ariga.io/atlas/cmd/atlas/internal/cmdapi.version=${VERSION}" \
            -o "../../dist/${BINARY_NAME}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum atlas-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/atlas-*
            dist/checksums.txt
